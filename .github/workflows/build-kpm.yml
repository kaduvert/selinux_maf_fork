name: Build

on:
  push:
    branches: ["**"]
    paths:
      - "selinux_hook/**"
      - ".github/workflows/build-kpm.yml"
  pull_request:
    paths:
      - "selinux_hook/**"
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a release'
        required: false
        default: 'false'
      tag:
        description: 'Release tag (e.g. v1.1.9-msm49)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build
        run: |
          mkdir -p target
          # ANDROID_NDK_LATEST_HOME is already set on ubuntu-latest runners;
          # the Makefile picks it up automatically via NDK_PATH.
          make -C selinux_hook
          cp selinux_hook/*.kpm target/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: selinux_hook-kpm
          path: target/*.kpm
          retention-days: 30

      - name: Release
        if: github.event.inputs.release == 'true' && github.event.inputs.tag != ''
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.tag }}
          artifacts: target/*.kpm
          allowUpdates: true
          makeLatest: true
          replacesArtifacts: true
